<!doctype html>
<html>
<head>
<meta charset="utf-8">
	<title>e6: CSS Box and positioning</title>
	<link rel="stylesheet" href="css/e6 stylesheet.css">
</head>

<body>
	<div class="container"></div>
	<img src="img/Complementary.jpg">
	<div class="box1">
		<h2>box1 uses absolute position</h2>
		</div>
	<div class="box2">
		<h3>box2 uses fixed position</h3>
		<div class="insidebox2"><p>Insidebox2</p>
		</div>
	<div class="box3">
		<h4>box3 uses static position</h4>
	</div>
		<div class="box4">
			<h5>box4 uses sticky position</h5>
		</div>
	</div>
</body>
</html>
